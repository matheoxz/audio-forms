spring.application.name=${APP_NAME:audio-forms}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:development}

# Frontend URL used for CORS (can be overridden per-profile)
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}

# Prefer the Spring-style env var if provided, otherwise allow a custom MONGODB_URI; fallback to local for development
# This resolves both: SPRING_DATA_MONGODB_URI and MONGODB_URI
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/audio-forms}}
logging.level.com.mongodb=DEBUG